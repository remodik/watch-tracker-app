<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c0c12" />
    <meta name="description" content="Персональная медиатека аниме и фильмов" />
    <title>Watch Tracker</title>
    <link rel="icon" href="/assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/assets/css/app.css" />
    <script type="module" src="/assets/js/app.js"></script>
  </head>
  <body>
    <a href="#content" class="skip-link">К содержимому</a>
    <div id="boot" class="boot" role="status">Загрузка Watch Tracker…</div>
    <main id="login" class="login" hidden>
      <section class="login-card">
        <div class="brand" id="login-brand"></div>
        <h1>Вход в медиатеку</h1>
        <p class="muted">Введите ключ доступа к личной коллекции.</p>
        <form id="login-form" class="stack">
          <label class="field"
            >Ключ доступа
            <input
              type="password"
              name="token"
              required
              maxlength="1024"
              autocomplete="current-password"
            />
          </label>
          <button class="button primary" type="submit">Войти</button>
          <p class="form-error" id="login-error" role="alert" hidden></p>
        </form>
      </section>
    </main>
    <div id="shell" class="shell" hidden>
      <aside class="sidebar">
        <div class="sidebar-heading">
          <a href="/" class="brand" id="brand" aria-label="Watch Tracker"></a>
          <button
            id="collapse"
            class="button icon-button subtle"
            type="button"
            aria-label="Свернуть панель"
          ></button>
        </div>
        <nav id="sidebar-nav" aria-label="Основная навигация"></nav>
        <div class="sidebar-footer">
          <div class="profile-mark" id="profile-mark"></div>
          <div class="profile-name">
            <b>Личная медиатека</b><small>Watch Tracker</small>
          </div>
          <a
            href="/settings"
            id="profile-settings"
            class="button icon-button subtle"
            aria-label="Настройки профиля"
          ></a>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <span id="section-name" class="section-name">Обзор</span>
          <form id="global-search" role="search" class="global-search">
            <span id="search-icon"></span>
            <input
              type="search"
              name="q"
              aria-label="Поиск в медиатеке"
              placeholder="Поиск в медиатеке…"
              maxlength="160"
            />
            <kbd aria-hidden="true">/</kbd>
          </form>
          <div class="top-actions">
            <button
              id="add"
              class="button primary"
              type="button"
              aria-label="Добавить произведение"
            ></button>
            <a
              href="/settings"
              id="quick-settings"
              class="button icon-button outline"
              aria-label="Настройки"
            ></a>
          </div>
        </header>
        <main id="content" class="content" tabindex="-1"></main>
      </div>
      <nav
        class="bottom-nav"
        id="bottom-nav"
        aria-label="Мобильная навигация"
      ></nav>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div
      id="toasts"
      class="toasts"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <div id="update-banner" class="update-banner" hidden>
      <span>Доступно обновление Watch Tracker</span>
      <button id="apply-update" class="button primary" type="button">
        Обновить
      </button>
      <button id="dismiss-update" class="button subtle" type="button">
        Позже
      </button>
    </div>
  </body>
</html>
